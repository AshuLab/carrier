<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tabs — quieter styles</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="shared.css">
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px;margin-top:8px}
.opt{border-radius:20px;background:var(--win);backdrop-filter:blur(40px);box-shadow:var(--shadow);padding:16px 18px 18px}
.opt h3{margin:0 0 2px;font-size:14px}.opt>p{margin:0 0 14px;color:var(--dim);font-size:12.5px;min-height:34px}
.ctx{margin-top:16px}.ctx>small{display:block;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}
.sbw{width:244px;border-radius:14px;background:var(--side);padding:10px 8px;box-shadow:0 0 0 .5px var(--line) inset}
.inw{width:300px;border-radius:14px;background:var(--side);padding:12px 14px;box-shadow:0 0 0 .5px var(--line) inset}
.ic{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.n{color:var(--faint);font-weight:500}.n.o{color:var(--orange)}
.fill button{flex:1;justify-content:center}

/* 1 glass (now) */
.g1{display:flex;gap:2px;padding:2px;border-radius:99px;background:var(--card2);box-shadow:0 0 0 .5px var(--line) inset,0 1px 6px rgba(0,0,0,.18);backdrop-filter:blur(20px) saturate(1.5)}
.g1.fit{display:inline-flex}
.g1 button{display:flex;align-items:center;gap:5px;border:0;background:none;color:var(--text);font:inherit;font-size:12.5px;padding:4px 10px;border-radius:99px;cursor:default;white-space:nowrap}
.g1 button.on{background:rgba(255,255,255,.14);font-weight:600}
body.light .g1 button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* 2 flat segmented (the system picker) */
.g2{display:flex;gap:0;padding:2px;border-radius:8px;background:var(--card2)}
.g2.fit{display:inline-flex}
.g2 button{display:flex;align-items:center;gap:5px;border:0;background:none;color:var(--dim);font:inherit;font-size:12.5px;padding:3px 10px;border-radius:6px;cursor:default;white-space:nowrap}
.g2 button.on{background:rgba(255,255,255,.14);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.25)}
body.light .g2 button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* 3 underline */
.g3{display:flex;gap:16px;border-bottom:.5px solid var(--line)}
.g3.fit{display:inline-flex}
.g3 button{display:flex;align-items:center;gap:5px;border:0;background:none;color:var(--dim);font:inherit;font-size:12.5px;padding:5px 1px 7px;cursor:default;white-space:nowrap;position:relative}
.g3 button.on{color:var(--text);font-weight:600}
.g3 button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--text)}
.g3.fill button{flex:1;justify-content:center}.g3.fill{gap:0}

/* 4 quiet pills: no container, only the chosen one has a fill */
.g4{display:flex;gap:4px}
.g4.fit{display:inline-flex}
.g4 button{display:flex;align-items:center;gap:5px;border:0;background:none;color:var(--dim);font:inherit;font-size:12.5px;padding:3px 10px;border-radius:99px;cursor:default;white-space:nowrap}
.g4 button.on{background:var(--card2);color:var(--text);font-weight:600}
.g4.fill button{flex:1;justify-content:center}

/* 5 text only */
.g5{display:flex;gap:14px}
.g5.fit{display:inline-flex}
.g5 button{display:flex;align-items:center;gap:5px;border:0;background:none;color:var(--faint);font:inherit;font-size:13px;font-weight:600;padding:2px 0;cursor:default;white-space:nowrap}
.g5 button.on{color:var(--text)}
.g5.fill{justify-content:space-between}
</style></head><body>
<h1>Tabs: quieter than glass</h1>
<div class="sub">Five styles in the three places the app has tabs. 1 is the glass one we have. The others drop the glass, the shadow and the capsule to different degrees. Click a tab to change it; the theme button flips light and dark.</div>
<div class="bar"><span class="sp"></span><button class="tog" id="theme">☾ / ☀︎ Light / dark</button></div>
<div class="grid" id="grid"></div>
<script>
const ICON={
 stack:'<svg class="ic" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="4" rx="1.3"/><rect x="2" y="9.5" width="12" height="4" rx="1.3"/></svg>',
 box:'<svg class="ic" viewBox="0 0 16 16"><path d="M2 5l6-3 6 3v6l-6 3-6-3zM2 5l6 3 6-3M8 8v6"/></svg>',
 term:'<svg class="ic" viewBox="0 0 16 16"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/><path d="M4.8 6.4l2 1.6-2 1.6M8.6 10h2.6"/></svg>',
 doc:'<svg class="ic" viewBox="0 0 16 16"><path d="M4 1.8h5l3.2 3.2v8.2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2.8a1 1 0 0 1 1-1z"/><path d="M9 1.8V5h3.2M5.4 8h5.2M5.4 10.6h5.2"/></svg>'
};
const CTX=[
 ['Sidebar · group by','sb',[['Status',ICON.stack],['Repository',ICON.box]],true],
 ['Epic · what to show','fit',[['Agent output',ICON.term],['Files changed',ICON.doc,'12']],false],
 ['Inspector · three tabs with counts','in',[['Slices','','1/5'],['Review','','R5','o'],['Details','']],true]
];
const STYLES=[
 ['1 · Glass (now)','g1','A capsule with a blur, a hairline and a shadow, the chosen one a lighter pill. The loudest of the five.'],
 ['2 · Flat segmented','g2','The look of the system\'s segmented picker: a rounded rectangle, the chosen segment raised a little. Familiar and still.'],
 ['3 · Underline','g3','No box. Text with a line under the chosen one and a hairline across. The quietest that still reads as tabs.'],
 ['4 · Quiet pills','g4','No container. Only the chosen tab has a soft fill. Light, and works with icons.'],
 ['5 · Text only','g5','Just words, the chosen one bright and the rest dim. For places where tabs are a heading more than a control.']
];
let sel={};
function tabs(cls,items,fill,key){
 const cur=sel[key]??0;
 return `<div class="${cls} ${fill?'fill':'fit'}">${items.map((t,i)=>`<button class="${i===cur?'on':''}" data-k="${key}" data-i="${i}">${t[1]||''}${t[0]}${t[2]?` <span class="n ${t[3]||''}">${t[2]}</span>`:''}</button>`).join('')}</div>`;
}
function render(){
 document.getElementById('grid').innerHTML=STYLES.map(([t,cls,d],si)=>`<div class="opt"><h3>${t}</h3><p>${d}</p>${CTX.map(([name,kind,items,fill],ci)=>{
  const body=tabs(cls,items,fill,si+'-'+ci);
  return `<div class="ctx"><small>${name}</small>${kind==='sb'?`<div class="sbw">${body}</div>`:kind==='in'?`<div class="inw">${body}</div>`:body}</div>`}).join('')}</div>`).join('');
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sel[b.dataset.k]=+b.dataset.i;render()});
}
document.getElementById('theme').onclick=()=>document.body.classList.toggle('light');
render();
</script>
</body></html>
