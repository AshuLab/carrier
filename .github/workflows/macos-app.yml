name: macOS app

# Same rule as ci.yml: a non-draft PR into main, here only when the app changed. Because of the paths filter it is not a required check.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "macos/**"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/macos-app.yml"

jobs:
  build-and-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version
      - name: Build
        working-directory: macos
        run: swift build
      - name: Test
        working-directory: macos
        run: scripts/test-ci.sh
      - name: Bundle
        working-directory: macos
        run: scripts/check-app.sh
