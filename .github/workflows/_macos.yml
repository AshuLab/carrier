name: Carrier macOS app

# The app (macos/): its tests and its bundle, in parallel on macOS, the expensive runner.
# Reusable: ci.yml calls it once the engine is green; run by hand to try a branch.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: xcodebuild -version
      - name: Build
        working-directory: macos
        run: swift build
      - name: Test
        working-directory: macos
        run: scripts/test-ci.sh

  # build-app.sh and what the updater needs from the bundle.
  bundle:
    name: Bundle
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bundle
        working-directory: macos
        run: scripts/check-app.sh
