name: Carrier macOS app

# The app (macos/): its tests and its bundle, in parallel on macOS, the expensive runner.
# Reusable: ci.yml calls it once the engine and the cheap checks are green, release.yml calls it with `bundle: false` (the tests only: the release builds and checks the bundle itself); run by hand to try a branch.
# The bundle (~18 min, a cold release build) runs only when the change can affect it: ci.yml decides. release.yml runs the same check before anything reaches the tap or the update feed.
on:
  workflow_call:
    inputs:
      bundle:
        description: Also build and check the bundle
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      bundle:
        description: Also build and check the bundle
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: xcodebuild -version
      - name: Build
        working-directory: macos
        run: swift build
      - name: Test
        working-directory: macos
        run: scripts/test-ci.sh

  # build-app.sh and what the updater needs from the bundle.
  bundle:
    name: Bundle
    if: inputs.bundle
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bundle
        working-directory: macos
        run: scripts/check-app.sh
