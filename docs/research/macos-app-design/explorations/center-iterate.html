const S=()=>ST[cur];
const IC={edit:'✎',test:'✓',cmd:'›_',read:'☰',err:'!',note:'!',ok:'✓'};
const eh=()=>{const s=S();return `<div class="eh"><div class="et">${s.title}</div><div class="es"><span>${s.repo} · #${s.n}</span>${s.labels.map(l=>`<span class="lab">${l}</span>`).join('')}${s.pr?`<a class="lk">PR #${s.pr} ↗</a>`:''}</div></div>`};
const trm=(t,hl)=>`<div class="trm">${t.map((l,i)=>`<div class="${hl&&i===t.length-1?'hl':''}"><span class="t">${l[0]}</span><span class="${l[1]}">${l[2]}</span></div>`).join('')}</div>`;
const chev='<svg width="12" height="12" viewBox="0 0 12 12"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const acts=()=>{const s=S();return `<div class="acts">${s.pr?`<button class="glass">Open PR #${s.pr}</button>`:''}<button class="glass">Open issue #${s.n}</button></div>`};
const dots='<span class="dots2"><i></i><i></i><i></i></span>';
// blocks
const hero=()=>{const s=S();return `<div class="pipe">${s.pipe.map((p,i)=>`<div class="pn2 ${p[1]}"><i>${p[1]==='d'?'✓':p[1]==='o'?'!':i+1}</i><b>${p[0]}</b><span>${p[2]}</span></div>`).join('')}</div><div class="cur"><b>${s.cur[0]}</b><p>${s.cur[1]}</p></div>`};
const slim=()=>{const s=S();return `<div class="slim">${s.pipe.map((p,i)=>`${i?'<span class="sl"></span>':''}<span class="sn ${p[1]}"><i>${p[1]==='d'?'✓':p[1]==='o'?'!':i+1}</i>${p[0]} <span style="color:var(--faint);font-weight:400">${p[2]}</span></span>`).join('')}</div>`};
const agent=(lines,hl)=>{const s=S(),c=s.kind==='o'?'o':s.kind==='g'?'g':'l';return `<div class="agent ${c}"><div class="ah ${s.kind===''?'live':''}">${av(s.agent)}<div class="sp1"><div class="nt">${s.now[0]} ${s.kind===''?dots:''}</div><div class="ns">${s.now[1]}</div></div></div>${trm(lines,true)}<div class="af"><span>last: ${s.last}</span><a class="lk">Full output ›</a></div></div>`};
const files=(mode)=>{const s=S(),m=Math.max(...s.files.map(f=>f[2]+f[3]),1);
 const row=f=>`<div class="fr2"><div class="pth"><span>${f[0]}</span>${f[1]}</div><div class="bb"><span style="width:${100*f[2]/m}%;background:var(--green)"></span><span style="width:${100*f[3]/m}%;background:var(--red)"></span></div><div class="df"><span class="p">+${f[2]}</span> <span class="m">−${f[3]}</span></div></div>`;
 const head=`<div class="hdrow"><b>Changes</b><span class="dim">${s.tot.files} files · <span style="color:var(--green)">+${s.tot.add}</span> <span style="color:var(--red)">−${s.tot.del}</span> · ${s.tot.tests}</span><span class="sp1"></span>${s.pr?'<a class="lk" style="font-size:12px">Files on GitHub ↗</a>':''}</div>`;
 if(mode==='slice'){const g={};s.files.forEach((f,i)=>{(g[SL[cur][i]]=g[SL[cur][i]]||[]).push(f)});
  return head+`<div class="sgm" style="width:230px"><button class="${ui.grp==='slice'?'on':''}" data-grp="slice">By slice</button><button class="${ui.grp==='file'?'on':''}" data-grp="file">By file</button></div><div class="fl">${Object.entries(g).map(([n,fs])=>`<div class="gh"><span>${n}</span><small>${fs.length} file${fs.length>1?'s':''} · +${fs.reduce((a,f)=>a+f[2],0)} −${fs.reduce((a,f)=>a+f[3],0)}</small></div>${fs.map(row).join('')}`).join('')}<div class="fr2" style="grid-template-columns:1fr"><a class="lk" style="font-size:12px">Show all ${s.tot.files} files</a></div></div>`}
 return head+(mode==='file'?'':'')+`<div class="fl">${s.files.map(row).join('')}<div class="fr2" style="grid-template-columns:1fr"><a class="lk" style="font-size:12px">Show all ${s.tot.files} files</a></div></div>`};
const extraLines=()=>{const s=S();return s.term};

const O=[
['A · Straight stack','The order you asked for: title, pipeline hero, the agent block (what it is doing now plus its output), then the files. Everything visible, one scroll.',()=>eh()+hero()+agent(S().term)+files('file')+acts()],
['B · Pipeline pinned on top','The pipeline collapses to a slim strip that stays pinned while you scroll the output and the files. You always know the stage.',()=>`<div class="cw-in">${slim()}${eh()}${agent(S().term.concat(S().term))}${files('file')}${acts()}</div>`,'sc'],
['C · Output / Changes tabs','Pipeline hero on top, then a switch. Output gets the whole space, or Changes does. Less to scroll, one thing at a time.',()=>{const s=S();return eh()+hero()+`<div class="sgm"><button class="${ui.tab==='out'?'on':''}" data-tab="out">Agent output</button><button class="${ui.tab==='chg'?'on':''}" data-tab="chg">Changes <i>${s.tot.files}</i></button></div>${ui.tab==='out'?agent(s.term):files('file')}${acts()}`}],
['D · Side by side (wide window)','When the window is wide, output and changes sit next to each other under the pipeline. Nothing hidden and no switching.',()=>eh()+hero()+`<div class="two"><div>${agent(S().term)}</div><div>${files('file')}</div></div>${acts()}`,'','wide'],
['E · Stages as an accordion','The pipeline is vertical and doubles as the container: finished stages fold into one line, the current stage is open and holds the agent output. Files go below.',()=>{const s=S();return eh()+`<div class="acc">${s.pipe.map((p,i)=>{const isCur=p[1]==='a'||p[1]==='o',o=isCur||ui.stg[i],sm=(SUM[cur]||{})[p[0]];
  return `<div class="ar ${p[1]} ${p[1]===''?'dim':''}"><span class="nb">${p[1]==='d'?'✓':p[1]==='o'?'!':i+1}</span><div class="bd"><div class="hd2" ${!isCur&&p[1]!==''?`data-stg="${i}"`:''}><b>${p[0]}</b><span>${p[2]}</span><span class="sp1"></span>${!isCur&&p[1]!==''?`<span class="cv" style="transform:rotate(${o?90:0}deg)">${chev}</span>`:''}</div>${isCur?`<div class="sm">${s.cur[1]}</div>${agent(s.term)}`:o&&sm?`<div class="sm">${sm}</div>`:''}</div></div>`}).join('')}</div>${files('file')}${acts()}`}],
['F · Stack, changes by slice','Same order as A, but Changes is grouped by the slice that produced each file, so it explains what each piece of work did. Toggle back to a flat list.',()=>eh()+hero()+agent(S().term)+files(ui.grp)+acts()]
];
function render(){
 document.getElementById('states').innerHTML=Object.entries(ST).map(([k,v])=>`<button class="${cur===k?'on':''}" data-st="${k}">${v.label}</button>`).join('');
 document.getElementById('opts').innerHTML=O.map(([t,p,f,sc,w])=>`<div class="opt ${w||''}"><h3>${t}</h3><p>${p}</p><div class="cw ${sc||''}">${f()}</div></div>`).join('');
 document.getElementById('needs').innerHTML='<b>New data this needs from the engine</b> (on top of the title, the files and the activity already listed for the earlier options): which <b>slice</b> produced each file (option F), and a one-line <b>summary per finished stage</b> (option E). The pipeline times are already in the snapshot.';
 document.querySelectorAll('[data-st]').forEach(e=>e.onclick=()=>{cur=e.dataset.st;ui.stg={};render()});
 document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{ui.tab=e.dataset.tab;render()});
 document.querySelectorAll('[data-grp]').forEach(e=>e.onclick=()=>{ui.grp=e.dataset.grp;render()});
 document.querySelectorAll('[data-stg]').forEach(e=>e.onclick=()=>{ui.stg[e.dataset.stg]=!ui.stg[e.dataset.stg];render()});
}
document.getElementById('theme').onclick=()=>document.body.classList.toggle('light');
render();
</script></body></html>
