# A tag vX.Y.Z publishes @ashulab/carrier at X.Y.Z, puts the app's zip on the GitHub Release and rewrites the formula and the cask in the tap.
# Run by hand with dry-run on, it does everything up to the publishing and pushes nothing.
# npm publishes through trusted publishing (OIDC, configured for this workflow on the package): no npm token.
# Secret: TAP_TOKEN (push to AshuLab/homebrew-tap).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, pack and install the formula from the tarball, build and check the app and the cask; publish and push nothing
        type: boolean
        default: true

permissions:
  contents: write # the GitHub Release of the tag
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      # Only a tag publishes: a tag is a real release, a manual run on a tag is real when dry-run is switched off, and anything else is a dry run.
      DRY_RUN: ${{ github.ref_type != 'tag' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false') }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag $REF_NAME is not vX.Y.Z" >&2; exit 1; }
            VERSION="${REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The tag is the version: set in this runner's copy only, nothing is committed back.
          VERSION="$VERSION" node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Pack
        run: |
          mkdir -p out
          pnpm pack --pack-destination out
          mv out/*.tgz "out/carrier-$VERSION.tgz"
          echo "SHA256=$(shasum -a 256 "out/carrier-$VERSION.tgz" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # Nothing is published before this point, so a failed app build leaves nothing on npm or in the tap.
      - name: Build the app
        run: ./macos/build-app.sh "$VERSION"

      # Its own step, so a Developer ID can replace the ad hoc signature without touching the rest.
      - name: Sign the app
        run: codesign --force --sign - macos/Carrier.app

      - name: Zip the app
        run: |
          ditto -c -k --keepParent macos/Carrier.app "out/Carrier-$VERSION.zip"
          (cd out && shasum -a 256 "Carrier-$VERSION.zip" > "Carrier-$VERSION.zip.sha256")
          echo "APP_SHA256=$(cut -d' ' -f1 "out/Carrier-$VERSION.zip.sha256")" >> "$GITHUB_ENV"

      - name: Check the zip
        run: |
          mkdir check
          ditto -x -k "out/Carrier-$VERSION.zip" check
          test -d check/Carrier.app
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' check/Carrier.app/Contents/Info.plist)"
          test "$PLIST_VERSION" = "$VERSION" || { echo "the app's plist says $PLIST_VERSION, not $VERSION" >&2; exit 1; }
          codesign --verify --strict check/Carrier.app

      - name: Tap
        if: env.DRY_RUN != 'true'
        uses: actions/checkout@v4
        with:
          repository: AshuLab/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Formula
        run: |
          mkdir -p formula
          # The tap's formula is rewritten; the one in this repo only seeds a tap that has none yet.
          if [ -f tap/Formula/carrier.rb ]; then cp tap/Formula/carrier.rb formula/carrier.rb; else cp .github/homebrew/carrier.rb formula/carrier.rb; fi
          URL="https://registry.npmjs.org/@ashulab/carrier/-/carrier-$VERSION.tgz"
          sed -i '' -E "s|^  url \".*\"|  url \"$URL\"|; s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" formula/carrier.rb
          brew tap-new --no-git local/ci
          # Homebrew 7 refuses to load a formula from an untrusted tap; older ones have no `brew trust`.
          if brew trust --help >/dev/null 2>&1; then brew trust local/ci; fi
          mkdir -p "$(brew --repository local/ci)/Formula"
          cp formula/carrier.rb "$(brew --repository local/ci)/Formula/carrier.rb"
          brew audit --strict local/ci/carrier

      - name: Install the formula from the tarball
        run: |
          TAP_DIR="$(brew --repository local/ci)/Formula"
          sed -i '' -E "s|^  url \".*\"|  url \"file://$PWD/out/carrier-$VERSION.tgz\"|" "$TAP_DIR/carrier.rb"
          brew install local/ci/carrier
          test "$(carrier --version)" = "$VERSION" || { echo "carrier --version printed: $(carrier --version)" >&2; exit 1; }
          brew uninstall carrier

      - name: Cask
        run: |
          mkdir -p cask
          # Like the formula: the tap's cask is rewritten; the one in this repo only seeds a tap that has none yet.
          if [ -f tap/Casks/carrier.rb ]; then cp tap/Casks/carrier.rb cask/carrier.rb; else cp .github/homebrew/carrier-cask.rb cask/carrier.rb; fi
          sed -i '' -E "s|^  version \".*\"|  version \"$VERSION\"|; s|^  sha256 \".*\"|  sha256 \"$APP_SHA256\"|" cask/carrier.rb
          mkdir -p "$(brew --repository local/ci)/Casks"
          cp cask/carrier.rb "$(brew --repository local/ci)/Casks/carrier.rb"
          # A finding about the quarantine step is named in a comment next to that step in the cask; any other one fails the run.
          STATUS=0
          brew audit --cask --strict local/ci/carrier > cask-audit.txt 2>&1 || STATUS=$?
          cat cask-audit.txt
          {
            echo "### brew audit --cask --strict (exit $STATUS)"
            echo '```'
            if [ -s cask-audit.txt ]; then cat cask-audit.txt; else echo "no findings"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Publish to npm
        if: env.DRY_RUN != 'true'
        # A re-run after a failed push to the tap finds the version already published and goes on to the formula.
        run: |
          if npm view "@ashulab/carrier@$VERSION" version >/dev/null 2>&1; then
            echo "@ashulab/carrier@$VERSION is already on npm, not publishing it again"
          else
            pnpm publish "out/carrier-$VERSION.tgz" --access public --no-git-checks
          fi

      - name: Formula from the published tarball
        if: env.DRY_RUN != 'true'
        run: |
          URL="https://registry.npmjs.org/@ashulab/carrier/-/carrier-$VERSION.tgz"
          # The registry can take a moment to serve what was just published.
          for i in 1 2 3 4 5 6; do
            curl -fsSL "$URL" -o published.tgz && break
            sleep 10
          done
          test -f published.tgz
          PUBLISHED="$(shasum -a 256 published.tgz | cut -d' ' -f1)"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"$PUBLISHED\"|" formula/carrier.rb

      - name: GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run finds the release already there and replaces its files.
        run: |
          FILES=("out/Carrier-$VERSION.zip" "out/Carrier-$VERSION.zip.sha256")
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VERSION" "${FILES[@]}" --title "v$VERSION" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

      - name: Summary
        run: |
          {
            echo "### Formula $([ "$DRY_RUN" = true ] && echo 'it would have written' || echo 'written') for $VERSION"
            echo '```ruby'
            cat formula/carrier.rb
            echo '```'
            echo "### Cask $([ "$DRY_RUN" = true ] && echo 'it would have written' || echo 'written') for $VERSION"
            echo '```ruby'
            cat cask/carrier.rb
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the formula and the cask to the tap
        if: env.DRY_RUN != 'true'
        working-directory: tap
        run: |
          mkdir -p Formula Casks
          cp ../formula/carrier.rb Formula/carrier.rb
          cp ../cask/carrier.rb Casks/carrier.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/carrier.rb Casks/carrier.rb
          # nothing to commit when a re-run finds the tap already at this version
          git diff --cached --quiet || git commit -m "carrier $VERSION"
          git push
