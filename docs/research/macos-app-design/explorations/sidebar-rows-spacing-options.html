<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sidebar rows — spacing and reading</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="shared.css">
<style>
:root{--s-run:#30d158;--s-need:#ff9f0a;--s-ready:#0a84ff;--s-wait:#8e8e93}body.light{--s-run:#28a745;--s-need:#e08600;--s-ready:#007aff}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--w,300px),1fr));gap:26px;align-items:start;margin-top:8px}
.opt>h3{margin:0 0 2px;font-size:14px}.opt>p{margin:0 0 10px;color:var(--dim);font-size:12.5px;max-width:var(--w,300px);min-height:50px}
.sb{border-radius:18px;background:var(--side);backdrop-filter:blur(40px);box-shadow:var(--shadow);padding:10px 8px 14px;width:var(--w,300px)}
.statebar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.seg{display:flex;gap:2px;background:var(--card2);border-radius:99px;padding:3px;box-shadow:0 0 0 .5px var(--line) inset}
.seg button{border:0;background:none;color:var(--dim);font:inherit;font-size:12.5px;font-weight:550;padding:6px 12px;border-radius:99px;cursor:default}
.seg button.on{background:var(--win);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px var(--line) inset}
body:not(.light) .seg button.on{background:rgba(255,255,255,.16)}
.s-gh{display:flex;align-items:center;margin:12px 10px 3px;height:20px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.s-row{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:center;padding:7px 10px;min-height:52px;border-radius:11px;cursor:default;margin-bottom:2px}
.s-row:hover:not(.sel){background:var(--card)}.s-row.sel{background:var(--sel)}
.s-m{min-width:0}.s-ttl{display:flex;gap:5px;min-width:0;align-items:baseline}
.s-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.s-no{flex:none;color:var(--dim);font-weight:500;font-variant-numeric:tabular-nums}
.s-sub{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;margin-top:3px}
.s-sub .id{color:var(--faint);font-variant-numeric:tabular-nums}
.s-sub .tag{flex:0 1 auto;max-width:48%;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:1px 8px;border-radius:99px;background:var(--card2);color:var(--text);font-size:10.5px;font-weight:600;line-height:15px}
.s-sub svg{width:11px;height:11px;margin:0 3px -1px 0;fill:currentColor}
.s-sub .tag svg{margin-right:5px;color:var(--dim)}.s-sub .rp svg{color:var(--dim)}
.s-sub.split,.s-sub.cap{display:flex;align-items:center;gap:7px}
.s-sub .st{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.s-sub .rp{flex:0 1 auto;max-width:48%;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-weight:600;font-size:11px}
.s-sub .rn{color:var(--text);font-weight:600}
.s-run{color:var(--s-run)}.s-need{color:var(--s-need)}
.s-gl{width:20px;height:20px;display:grid;place-items:center;flex:none}
.s-spn{width:16px;height:16px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--s-run) 25%,transparent);border-top-color:var(--s-run);animation:s 1s linear infinite}
.s-hol{width:14px;height:14px;border-radius:50%;border:2px solid var(--s-wait)}
.s-fil{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800}
.s-need-bg{background:var(--s-need)}.s-ready-bg{background:var(--s-ready)}

.s-row{gap:var(--gap,10px);padding:var(--py,7px) 10px;min-height:var(--mh,52px);margin-bottom:var(--mb,2px)}
.s-sub{margin-top:var(--tg,3px)}
.s-nm.two{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.s-no.meta{font-size:11.5px;font-weight:500}
.quiet .s-sub .rp{color:var(--dim);font-weight:400}</style></head><body>
<h1>Sidebar rows: spacing and reading</h1>
<div class="sub">Same data as the app today (Done group, sample titles). Only spacing and the order of the pieces change. <b>Sidebar 300 / 240</b> narrows it.</div>
<div class="statebar"><span class="sp"></span><button class="tog" id="wd">Sidebar 300 / 240</button><button class="tog" id="theme">☾ / ☀︎ Light / dark</button></div>
<div class="opts" id="opts"></div>
<script>
const E=[
 {repo:'carrier',n:302,t:'The sidebar names each epic by its title',d:'34s ago'},
 {repo:'carrier',n:311,t:'A stopped epic can be resumed',d:'22m ago',sel:1},
 {repo:'carrier',n:292,t:'The Agent output tab lets you open the sessions it folds away',d:'4h 31m ago'},
 {repo:'carrier',n:282,t:'Finished epics in view',d:'4h 52m ago'},
 {repo:'carrier',n:272,t:'The Agent output tab tells expected from unexpected',d:'4h 59m ago'},
 {repo:'sass-blueprint',n:635,t:'billing: checkBillingAccess throws on missing plan',d:'17h 19m ago'},
 {repo:'encaja',n:627,t:'Inactive account: receipts-only mode',d:'1d 1h ago'},
];
const GH='<svg viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';
const gl='<i class="s-fil" style="background:#30d158">✓</i>';
// kind: A as today, B more air, C title on two lines + number in the meta line, D = C with the repository as a quiet right-hand label
function row(k,e){
 const rp=`<span class="rp" title="${e.repo}">${GH}${e.repo}</span>`;
 let top,sub;
 if(k==='C'||k==='D'){
  top=`<span class="s-nm two">${e.t}</span>`;
  sub=`<span class="st"><span class="s-no meta">#${e.n}</span> · ${e.d}</span>${rp}`;
 }else{
  top=`<span class="s-nm">${e.t}</span><span class="s-no">#${e.n}</span>`;
  sub=`<span class="st">${e.d}</span>${rp}`;
 }
 return `<div class="s-row${e.sel?' sel':''}"><div class="s-gl">${gl}</div><div class="s-m"><div class="s-ttl">${top}</div><span class="s-sub split">${sub}</span></div></div>`;
}
const V=[
 ['A · as it is','Row padding 7, 1-3px between lines, 2px between rows.','A','--py:7px;--mh:52px;--mb:2px;--tg:3px;--gap:10px'],
 ['B · more air','Same content. Padding 10, 4px between title and state, 4px between rows, wider glyph gap.','B','--py:10px;--mh:58px;--mb:4px;--tg:5px;--gap:12px'],
 ['C · title gets two lines','The title wraps to two lines instead of cutting at "epi…". #number moves to the second line next to the time; repository stays right.','C','--py:10px;--mh:58px;--mb:4px;--tg:5px;--gap:12px'],
 ['D · C, airier and a quiet repository','As C with 12px padding, 6px between rows, repository in secondary colour and normal weight.','D','--py:12px;--mh:60px;--mb:6px;--tg:6px;--gap:12px'],
];
function draw(){document.getElementById('opts').innerHTML=V.map(([t,p,k,vars])=>`<div class="opt"><h3>${t}</h3><p>${p}</p><div class="sb ${k==='D'?'quiet':''}" style="${vars}"><div class="s-gh">Done</div>${E.map(e=>row(k,e)).join('')}</div></div>`).join('')}
let wide=true;document.getElementById('wd').onclick=()=>{wide=!wide;document.documentElement.style.setProperty('--w',wide?'300px':'240px')};
document.getElementById('theme').onclick=()=>document.body.classList.toggle('light');
draw();
</script></body></html>
